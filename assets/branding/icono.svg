<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="bgRed" x1="120" y1="80" x2="920" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F24B27"/>
      <stop offset="52%" stop-color="#E63E1C"/>
      <stop offset="100%" stop-color="#B82E12"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(460 360) rotate(45) scale(560)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo rojo carrera con degradado sutil -->
  <rect width="1024" height="1024" fill="url(#bgRed)"/>
  <rect width="1024" height="1024" fill="url(#topGlow)"/>

