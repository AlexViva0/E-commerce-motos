<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <defs>
    <linearGradient id="cardBack" x1="55" y1="45" x2="235" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E63E1C"/>
      <stop offset="100%" stop-color="#B82E12"/>
    </linearGradient>
    <linearGradient id="badgeHeart" x1="205" y1="54" x2="256" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5733"/>
      <stop offset="100%" stop-color="#E63E1C"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular suave -->
  <circle cx="150" cy="150" r="118" fill="#F5F6F8"/>
  <path d="M46 210 L108 66 L254 66 L192 210 Z" fill="#FFB020" opacity="0.1"/>

  <!-- Tarjeta trasera inclinada (efecto comparación múltiple) -->
  <g transform="rotate(-6 150 150)">
    <rect x="58" y="56" width="168" height="202" rx="16" fill="url(#cardBack)" opacity="0.92"/>
  </g>

  <!-- Tarjeta principal ficha técnica -->
  <rect x="64" y="54" width="172" height="202" rx="16" fill="#FFFFFF" stroke="#15171C" stroke-width="2.4"/>

  <!-- Cabecera grafito de la ficha -->
  <path d="M64 70 C64 61.1634 71.1634 54 80 54 H220 C228.837 54 236 61.1634 236 70 V98 H64 V70 Z" fill="#15171C"/>
  <!-- Acento rojo racing arriba -->
  <rect x="80" y="66" width="44" height="6" rx="3" fill="#E63E1C"/>
  <rect x="80" y="79" width="84" height="6" rx="3" fill="#FFFFFF" opacity="0.88"/>

  <!-- Mini silueta deportiva en cabecera -->
  <circle cx="192" cy="83" r="6" stroke="#FFB020" stroke-width="2"/>
  <circle cx="214" cy="83" r="6" stroke="#FFB020" stroke-width="2"/>
  <path d="M192 83 L201 72 L212 75 L214 83" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fila 1: Check + barra potencia -->
  <g>
    <circle cx="92" cy="124" r="11" fill="#E63E1C"/>
    <path d="M87 124 L90.5 127.5 L97.5 120" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="116" width="54" height="5" rx="2.5" fill="#15171C"/>
    <rect x="112" y="126" width="102" height="7" rx="3.5" fill="#F5F6F8"/>
    <rect x="112" y="126" width="84" height="7" rx="3.5" fill="#E63E1C"/>
  </g>

  <!-- Fila 2: Check ámbar + barra par motor -->
  <g>
    <circle cx="92" cy="162" r="11" fill="#FFB020"/>
    <path d="M87 162 L90.5 165.5 L97.5 158" stroke="#15171C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="154" width="66" height="5" rx="2.5" fill="#15171C"/>
    <rect x="112" y="164" width="102" height="7" rx="3.5" fill="#F5F6F8"/>
    <rect x="112" y="164" width="68" height="7" rx="3.5" fill="#FFB020"/>
  </g>

  <!-- Fila 3: Check grafito + barra peso/agilidad -->
  <g>
    <circle cx="92" cy="200" r="11" fill="#15171C"/>
    <path d="M87 200 L90.5 203.5 L97.5 196" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="192" width="46" height="5" rx="2.5" fill="#15171C"/>
    <rect x="112" y="202" width="102" height="7" rx="3.5" fill="#F5F6F8"/>
    <rect x="112" y="202" width="92" height="7" rx="3.5" fill="#15171C"/>
  </g>

  <!-- Pie de ficha con 3 mini chips de specs -->
  <rect x="80" y="224" width="44" height="18" rx="6" fill="#F5F6F8" stroke="#15171C" stroke-width="1.4"/>
  <rect x="88" y="231" width="28" height="4" rx="2" fill="#15171C"/>

  <rect x="131" y="224" width="44" height="18" rx="6" fill="#F5F6F8" stroke="#15171C" stroke-width="1.4"/>
  <rect x="139" y="231" width="28" height="4" rx="2" fill="#E63E1C"/>

  <rect x="182" y="224" width="38" height="18" rx="6" fill="#FFB020"/>
  <rect x="189" y="231" width="24" height="4" rx="2" fill="#15171C"/>

  <!-- Sello flotante de Favorita (corazón) -->
  <g>
    <circle cx="232" cy="80" r="27" fill="#FFFFFF" stroke="#15171C" stroke-width="2.4"/>
    <circle cx="232" cy="80" r="21" fill="url(#badgeHeart)"/>
    <path d="M232 90.5 C232 90.5 220 82.8 220 75.5 C220 71.9 222.8 69.2 226.2 69.2 C228.5 69.2 230.6 70.5 232 72.4 C233.4 70.5 235.5 69.2 237.8 69.2 C241.2 69.2 244 71.9 244 75.5 C244 82.8 232 90.5 232 90.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- Destellos dinámicos alrededor del sello -->
  <line x1="258" y1="54" x2="266" y2="46" stroke="#FFB020" stroke-width="3" stroke-linecap="round"/>
  <line x1="265" y1="74" x2="275" y2="72" stroke="#E63E1C" stroke-width="3" stroke-linecap="round"/>
  <line x1="234" y1="44" x2="236" y2="35" stroke="#15171C" stroke-width="2.5" stroke-linecap="round"/>
</svg>
